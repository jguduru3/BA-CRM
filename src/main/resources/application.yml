spring:
  application:
    name: better-crm

  # Choose with SPRING_PROFILES_ACTIVE: local (H2, zero setup) | postgres | docker | azure.
  profiles:
    default: local

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate must never auto-generate DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1500000

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

  lifecycle:
    timeout-per-shutdown-phase: 25s

  data:
    redis:
      # Only used when app.redis.enabled=true (REDIS_ENABLED); the app runs fine without Redis.
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-* only from the reverse proxy (Tomcat RemoteIpValve's
  # internal-network default) so client IPs in audit logs / rate limits are real.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/csv
    min-response-size: 2048
  tomcat:
    max-swallow-size: 26MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs/openapi.json
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs
    operations-sorter: alpha
    tags-sorter: alpha
  paths-to-match: /api/**

app:
  jwt:
    # No default: required (32+ bytes) in every profile except local and test.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}   # 12h
    # Refuse to start with a missing/short/known-default JWT secret or encryption
    # key. Relaxed only in the local and test profiles.
    enforce-strong-secret: true

  # AES-256-GCM key for third-party secrets stored in the DB (AI keys, WhatsApp
  # tokens, SMTP passwords, webhook secrets). Required (32+ chars) outside local/test.
  # Keep it stable — see DEPLOYMENT.md for rotation.
  encryption-key: ${ENCRYPTION_KEY:${APP_ENCRYPTION_KEY:}}
  # Previous key, accepted for decryption only while rotating (DEPLOYMENT.md).
  encryption-key-previous: ${ENCRYPTION_KEY_PREVIOUS:}

  redis:
    # Off by default: no Redis connection is ever attempted (RedisAutoConfigToggle).
    enabled: ${REDIS_ENABLED:false}
    # TEAM-scope permission sets are cached this long when Redis is on.
    permission-cache-ttl-seconds: ${PERMISSION_CACHE_TTL_SECONDS:60}

  bootstrap:
    # First-admin bootstrap (BootstrapAdminRunner): replaces the published V1 seed
    # password of admin@betteranalytics.in once; the forced change stays on.
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  applicationinsights:
    # Telemetry is attached at start-up only when this is set.
    connection-string: ${APPLICATIONINSIGHTS_CONNECTION_STRING:}

  cors:
    # Comma-separated browser origins allowed to call the API cross-origin.
    # Empty = same-origin only (the SPA proxies /api, so this is the norm).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  rate-limit:
    per-ip-per-minute: ${RATE_LIMIT_PER_IP_PER_MINUTE:1200}
    api-key-per-minute: ${RATE_LIMIT_API_KEY_PER_MINUTE:600}
    # Sign-in: per client IP per minute, and per email per window.
    login-per-ip-per-minute: ${RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE:20}
    login-per-email: ${RATE_LIMIT_LOGIN_PER_EMAIL:10}
    login-email-window-minutes: 5

  auth:
    max-failed-logins: 5
    lock-minutes: 15

  outbound:
    # Allow webhooks / custom-API automations to reach private addresses. Dev only.
    allow-private-networks: ${OUTBOUND_ALLOW_PRIVATE_NETWORKS:false}

  whatsapp:
    # Meta Graph API base URL — override via env var in production
    graph-url: ${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v19.0}
    # Meta App Secret — verifies X-Hub-Signature-256 on inbound webhooks.
    app-secret: ${WHATSAPP_APP_SECRET:}
    allow-unsigned-webhooks: false

  push:
    # Web push via Azure Notification Hubs (no Firebase). Blank = push disabled.
    azure-hub:
      connection-string: ${AZURE_NOTIFICATION_HUB_CONNECTION_STRING:}
      name: ${AZURE_NOTIFICATION_HUB_NAME:}
    # Public half of the VAPID key pair configured on the hub (Browser / Web Push settings).
    vapid-public-key: ${WEBPUSH_VAPID_PUBLIC_KEY:}

  storage:
    # Attachment storage when Azure Blob isn't configured (azure.blob.connection-string
    # below) — local disk, so file/image uploads work with zero cloud setup.
    local-dir: ${LOCAL_UPLOAD_DIR:./data/uploads}

  # Public origin of the app as recipients reach it (e.g. https://crm.example.com).
  # Used for one-click email unsubscribe links; blank = mailto: unsubscribe only.
  public-base-url: ${APP_PUBLIC_BASE_URL:}

  campaigns:
    # Send rate per sending mailbox / for the SMS sender (per app instance); 0 = unthrottled.
    email-per-minute: ${CAMPAIGN_EMAIL_PER_MINUTE:60}
    sms-per-minute: ${CAMPAIGN_SMS_PER_MINUTE:60}

  sms:
    # Azure Communication Services: "endpoint=https://<res>.communication.azure.com/;accesskey=<base64>"
    # and the E.164 sender number. Either blank = SMS campaigns disabled (launch → 409).
    connection-string: ${AZURE_COMMUNICATION_CONNECTION_STRING:}
    from: ${AZURE_SMS_FROM:}
    # Shared secret for the Event Grid webhook POST /api/sms/events?secret=… (inbound STOP/START).
    events-secret: ${AZURE_SMS_EVENTS_SECRET:}

  email:
    inbox-poll:
      # Reads new messages of mailboxes with "Watch inbox for replies" on (sequence replies,
      # bounces, unsubscribe replies, activity log). One instance at a time (ShedLock).
      enabled: ${EMAIL_INBOX_POLL_ENABLED:true}
      delay-ms: ${EMAIL_INBOX_POLL_DELAY_MS:300000}
      batch-size: ${EMAIL_INBOX_POLL_BATCH:50}

azure:
  blob:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container: ${AZURE_BLOB_CONTAINER:bettercrm-docs}
  keyvault:
    uri: ${AZURE_KEYVAULT_URI:}

---
# ── Local development (matches the Node app's SQLite dev loop, via H2) ──
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/crm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    # Dev-only fallback so `mvn spring-boot:run` works with zero setup. Never used
    # outside the local profile (every other profile requires JWT_SECRET).
    secret: ${JWT_SECRET:local-dev-only-insecure-jwt-secret-do-not-deploy}
    enforce-strong-secret: false
  outbound:
    allow-private-networks: true
  whatsapp:
    allow-unsigned-webhooks: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

---
# ── Local PostgreSQL (for testing against the real engine instead of H2) ──
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
# ── Docker Compose (Postgres container on the compose network, no TLS) ──
# Same env vars as the azure profile (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASS)
# so the two are interchangeable at the environment-variable level — this one
# just drops sslmode=require, which the compose Postgres image doesn't serve.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
# ── Azure Database for PostgreSQL Flexible Server (production, per the locked stack) ──
spring:
  config:
    activate:
      on-profile: azure
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
# ── Engagement: automation cron scan (applies to every profile) ──
app:
  automations:
    scheduler-delay-ms: ${AUTOMATIONS_SCHEDULER_DELAY_MS:60000}
